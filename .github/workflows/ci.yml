name: "CI - Kiem Tra Chat Luong Ma Nguon"

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

# Mô hình nhánh: main (Production) · develop (Staging) · feature/* · fix/* · docs/* -> docs/guides/git/GIT-BRANCHING.md
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: "Lint & Typecheck (Backend + Frontend)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Check Launcher Scripts (HoYoSalon)
        run: npm run check:scripts

      - name: Test Launcher Libraries (version, changelog, zip, redaction)
        run: npm run test:scripts

      - name: Typecheck Backend
        working-directory: ./backend
        run: npm run typecheck

      - name: Typecheck Frontend
        working-directory: ./frontend
        run: npm run typecheck

      - name: Lint Backend
        working-directory: ./backend
        run: npm run lint

      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Unit Tests Frontend (mock backend rules)
        working-directory: ./frontend
        run: npm test

      # typecheck không bắt được lỗi bundling (import động, manualChunks, CSS Tailwind) -> build thật
      - name: Build Backend
        working-directory: ./backend
        run: npm run build

      - name: Build Frontend (production, API mode)
        working-directory: ./frontend
        run: npm run build

  unit-tests:
    name: "Unit Tests Backend (Jest)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Jest Unit Tests
        working-directory: ./backend
        run: npm run test

  e2e-tests:
    name: "E2E Backend (PostgreSQL ${{ matrix.postgres }}, CSDL kiem thu tam)"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [15, 16]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: salon
          POSTGRES_PASSWORD: salon123
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salon -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: salon
      DB_PASSWORD: salon123
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      # Bộ e2e tự TẠO CSDL salon_booking_test (tên bắt buộc kết thúc bằng _test), chạy migration, rồi XOÁ sau khi xong.
      # Không bao giờ đụng tới CSDL làm việc (xem backend/test/support/global-setup.ts).
      - name: Run E2E Tests
        working-directory: ./backend
        run: npm run test:e2e

  portable-install:
    name: "Portable install/build (${{ matrix.os }}, Node 22)"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm run check:scripts
      - run: npm run test:scripts
      - run: npm run test --prefix backend -- --runInBand
      - run: npm run test --prefix frontend
      - run: npm run build

  production-image:
    name: "Production image build candidate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/docker/Dockerfile.production --build-arg COMMIT_SHA=${{ github.sha }} -t salon-spa:ci .
