# Nginx phía trước: phục vụ giao diện đã build (cache dài hạn cho /assets có băm tên tệp), nén gzip + brotli,
# chuyển /api, /health, /uploads tới API NestJS. Luồng đồng bộ trực tiếp (SSE /api/events/stream) không bị đệm.
upstream salon_api {
  server api:3000;
  keepalive 16;
}

server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 5m;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
  brotli on;
  brotli_comp_level 6;
  brotli_min_length 1024;
  brotli_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

  location = /nginx-health { access_log off; return 200 "ok\n"; }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location = /version.json { add_header Cache-Control "no-store" always; try_files $uri =404; }

  location /api/events/ {
    proxy_pass http://salon_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location ~ ^/(api|health|uploads)(/|$) {
    proxy_pass http://salon_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # SPA: mọi đường dẫn còn lại trả index.html (không cache để luôn nhận bản giao diện mới)
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
