<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF7F2" />
    <script>
      /* Chọn giao diện TRƯỚC lần vẽ đầu (không nháy màu): trang khách = Lotus Ivory; khu nhân viên = lựa chọn đã lưu
         (mặc định sáng, Lotus Noir khi trực đêm). Logic khớp src/utils/theme.ts. */
      (function () {
        var colors = { ivory: '#FAF7F2', light: '#F8FAFC', noir: '#080C10' };
        var t = 'ivory';
        try {
          if (/^\/(quan-ly|dang-nhap|quen-mat-khau|dat-lai-mat-khau)(\/|$)/.test(location.pathname)) {
            t = localStorage.getItem('salon.staffTheme') === 'noir' ? 'noir' : 'light';
          }
        } catch (e) { /* chế độ riêng tư chặn localStorage: dùng mặc định */ }
        document.documentElement.setAttribute('data-theme', t);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', colors[t]);
      })();
    </script>
    <meta name="description" content="Đặt lịch salon - spa trực tuyến: chọn dịch vụ, chọn thợ, chốt khung giờ còn trống trong một phút." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Font tự host (src/fonts.css): nạp trước 3 tệp mà tiêu đề trang chủ (phần tử LCP) cần ngay -->
    <link rel="preload" href="/fonts/cormorant-garamond-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/cormorant-garamond-normal-vietnamese.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>Salon &amp; Spa Hương Sen — Đặt lịch trực tuyến</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
